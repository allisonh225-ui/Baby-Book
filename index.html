<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: black;
  color: white;
  font-family: Arial;
  margin: 0;
}
 
.header {
  position: sticky;
  top: 0;
  background: black;
  z-index: 1000;
  padding: 10px;
  border-bottom: 2px solid #f59aec;
}

.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.controls {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
}

.view-btn {
  padding: 10px 14px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
  background: #f59aec;
  color: black;
  font-weight: bold;
  margin-right: 6px;
}

.view-btn.active {
  background: white;
}

#groupFilter {
  padding: 10px;
  font-size: 16px;
}

.row {
  border-bottom: 1px solid #444;
  padding: 14px;
}

.row.yellow { background: rgba(255,255,0,0.08); }
.row.red    { background: rgba(255,0,0,0.08); }
.row.green  { background: rgba(0,255,0,0.08); }

.row-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.date {
  color: #f59aec;
  font-weight: bold;
}


.card {
  margin-top: 10px;
  padding: 18px;
  background: #111;
  border-radius: 10px;
}
.card input,
.card select,
.card textarea {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  font-size: 17px;
  border-radius: 6px;
  border: none;
}

.card textarea {
  min-height: 90px;
}


.status-icon {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-right: 10px;
  font-size: 13px;
  font-weight: bold;
  color: black;
}
.radio-group {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.radio-group label {
  padding: 10px 14px;
  border-radius: 6px;
  background: #333;
  color: white;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}

.radio-group input[type="radio"] {
  width: 18px;
  height: 18px;
  margin: 0;
  padding: 0;
  accent-color: #f59aec;
}

.radio-group label:has(input:checked) {
  background: #f59aec;
  color: black;
  font-weight: bold;
}
.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="header">
  <div class="top-row">
    <h2>Baby Book</h2>
    <div id="liveCount">Live: 0</div>
  </div>

  <div class="controls">
    <div>
      <button id="listBtn" class="view-btn active" onclick="switchView('list')">List</button>
      <button id="calBtn" class="view-btn" onclick="switchView('calendar')">Calendar</button>
    </div>

    <select id="groupFilter"></select>
  </div>

  <div id="calendarControls" class="hidden" style="margin-top:10px;">
    <input type="date" id="calendarDate">
    <button class="view-btn" onclick="goToday()">Today</button>
    <div id="dayCount"></div>
  </div>
</div>

<div id="app"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwDEpL21Qwj2eWiLSrgNf0kaV2xc3L2ov47CwUH9ZmVih1TgwwB679-BXxs4tQBTxM6OA/exec";

let roster = [];
let records = {};
let selectedGroup = "";
let currentView = "list";
let selectedDate = new Date().toISOString().split("T")[0];

// ✅ LOAD DATA
async function loadData() {
  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    const data = await res.json();

    roster = data.map(row => ({
      AnimalID: String(row.AnimalID),
      Name: row.Name || "(no name)",
      Group: row.Group,
      Shelter: row.Shelter
    }));

    records = {};

    data.forEach(row => {
      records[row.AnimalID] = {
        DeliveryDate: formatDate(row["Delivery Date"]),
        InfantStatus: row["Infant Status"],
        Placenta: row["Placenta"],
        Foster: row["Foster Infant"],
        Notes: row["Notes"]
      };
    });

    roster.sort((a,b) => Number(a.AnimalID) - Number(b.AnimalID));

    init();
    render();

  } catch (err) {
    console.error(err);
  }
}

function formatDate(d) {
  if (!d) return "";
  return new Date(d).toISOString().split("T")[0];
}

// ✅ INIT (WITH CORRECT SHELTER SORT)
let initialized = false;

function init() {
  let filter = document.getElementById("groupFilter");
  if (!filter) return;

  let groups = roster.map(r => ({
    label: r.Shelter + " | " + r.Group,
    shelterNum: parseInt((r.Shelter || "").replace(/\D/g, "")) || 0
  }));

  groups = groups.filter((v, i, a) =>
    a.findIndex(x => x.label === v.label) === i
  );

  groups.sort((a, b) => a.shelterNum - b.shelterNum);

  const prevSelection = filter.value;
  filter.innerHTML = "<option value=''>All Groups</option>";
  groups.forEach(g => {
    filter.innerHTML += `<option value="${g.label}">${g.label}</option>`;
  });
  filter.value = selectedGroup;

  filter.onchange = e => {
    selectedGroup = e.target.value;
    render();
  };

  if (!initialized) {
    document.getElementById("calendarDate").value = selectedDate;
    document.getElementById("calendarDate").onchange = (e) => {
      selectedDate = e.target.value;
      render();
    };
    initialized = true;
  }
}

// ✅ STATUS
function getStatus(rec) {
  if (!rec.DeliveryDate) return { color:"yellow", cls:"yellow", label:"" };
  if (rec.Foster === "Yes") return { color:"limegreen", cls:"green", label:"F" };
  if (rec.InfantStatus === "Alive") return { color:"limegreen", cls:"green", label:"" };
  return { color:"red", cls:"red", label:"" };
}

// ✅ SAVE
function save(id, field, value) {
  if (!records[id]) records[id] = {};
  records[id][field] = value;

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      AnimalID: id,
      "Delivery Date": records[id].DeliveryDate,
      "Infant Status": records[id].InfantStatus,
      "Placenta": records[id].Placenta,
      "Foster Infant": records[id].Foster,
      "Notes": records[id].Notes
    })
  });
}

function toggleCard(id) {
  document.getElementById("card-" + id).classList.toggle("hidden");
}

function switchView(view) {
  currentView = view;

  document.getElementById("calendarControls")
    .classList.toggle("hidden", view !== "calendar");

  document.getElementById("listBtn").classList.toggle("active", view === "list");
  document.getElementById("calBtn").classList.toggle("active", view === "calendar");

  render();
}

function goToday() {
  selectedDate = new Date().toISOString().split("T")[0];
  document.getElementById("calendarDate").value = selectedDate;
  render();
}

// ✅ RENDER
function render() {
  let app = document.getElementById("app");
  app.innerHTML = "";

  let liveCount = 0;

  if (currentView === "list") {

    roster
      .filter(r => !selectedGroup || (r.Shelter + " | " + r.Group) === selectedGroup)
      .forEach(r => {

        let rec = records[r.AnimalID] || {};
        const status = getStatus(rec);

        if (rec.DeliveryDate && (rec.Foster==="Yes" || rec.InfantStatus==="Alive")) {
          liveCount++;
        }

        let row = document.createElement("div");
        row.className = "row " + status.cls;

        row.innerHTML = `
          <div class="row-header" onclick="toggleCard('${r.AnimalID}')">
            <div style="display:flex; align-items:center;">
              <div class="status-icon" style="background:${status.color}">
                ${status.label}
              </div>
              ${r.AnimalID} ${r.Name}
            </div>
            <div class="date">${rec.DeliveryDate || "—"}</div>
          </div>

        <div id="card-${r.AnimalID}" class="card hidden">

            <div style="display:flex; gap:8px; margin-top:12px;">
              <input type="date" id="date-${r.AnimalID}"
                value="${rec.DeliveryDate || ''}"
                style="flex:1; margin-top:0;"
                onchange="
                  save('${r.AnimalID}','DeliveryDate', this.value);
                  if (!records['${r.AnimalID}']?.InfantStatus) {
                    save('${r.AnimalID}','InfantStatus','Alive');
                  }
                  if (!records['${r.AnimalID}']?.Foster) {
                    save('${r.AnimalID}','Foster','No');
                  }
                  render();
                ">
              <button class="view-btn" style="margin:0; background:#ff4444; color:white;"
                onclick="
                  records['${r.AnimalID}'].DeliveryDate = '';
                  records['${r.AnimalID}'].InfantStatus = '';
                  save('${r.AnimalID}','DeliveryDate','');
                  save('${r.AnimalID}','InfantStatus','');
                  document.getElementById('date-${r.AnimalID}').value = '';
                ">✕</button>
            </div>

            <select onchange="save('${r.AnimalID}','InfantStatus', this.value)">
              <option value="">Infant</option>
              <option ${rec.InfantStatus==="Alive"?"selected":""}>Alive</option>
              <option ${rec.InfantStatus==="Deceased"?"selected":""}>Deceased</option>
              <option ${rec.InfantStatus==="Pulled"?"selected":""}>Pulled</option>
            </select>

            <select onchange="save('${r.AnimalID}','Placenta', this.value)">
              <option value="">Placenta</option>
              <option ${rec.Placenta==="Yes"?"selected":""}>Yes</option>
              <option ${rec.Placenta==="No"?"selected":""}>No</option>
            </select>

            <select onchange="save('${r.AnimalID}','Foster', this.value)">
              <option value="">Foster</option>
              <option ${rec.Foster==="Yes"?"selected":""}>Yes</option>
              <option ${rec.Foster==="No"?"selected":""}>No</option>
            </select>

            <textarea onchange="save('${r.AnimalID}','Notes', this.value)">
${rec.Notes || ""}
            </textarea>

          </div>
        `;

        app.appendChild(row);
      });

    document.getElementById("liveCount").innerText = "Live: " + liveCount;
  }

  else {
    document.getElementById("liveCount").innerText = selectedDate;
  
    let deliveries = Object.entries(records)
      .filter(([id, rec]) => rec.DeliveryDate === selectedDate);

    document.getElementById("dayCount").innerText =
      "Deliveries: " + deliveries.length;
    
deliveries.forEach(([id, rec]) => {
      const female = roster.find(r => r.AnimalID === id);
      const status = getStatus(rec);

      let row = document.createElement("div");
      row.className = "row " + status.cls;

      row.innerHTML = `
        <div class="row-header" onclick="toggleCard('cal-${id}')">
          <div style="display:flex; align-items:center;">
            <div class="status-icon" style="background:${status.color}">
              ${status.label}
            </div>
            <b>${id}</b> &nbsp; ${female?.Name || ""}
          </div>
          <div style="font-size:13px; color:#aaa;">${female?.Group || ""} | ${female?.Shelter || ""}</div>
        </div>

        <div id="card-cal-${id}" class="card hidden">

          <div style="display:flex; gap:8px; margin-top:12px;">
            <input type="date" id="caldate-${id}"
              value="${rec.DeliveryDate || ''}"
              style="flex:1; margin-top:0;"
              onchange="
                save('${id}','DeliveryDate', this.value);
                if (!records['${id}']?.InfantStatus) {
                  save('${id}','InfantStatus','Alive');
                }
                if (!records['${id}']?.Foster) {
                  save('${id}','Foster','No');
                }
                render();
              ">
            <button class="view-btn" style="margin:0; background:#ff4444; color:white;"
              onclick="
                records['${id}'].DeliveryDate = '';
                records['${id}'].InfantStatus = '';
                save('${id}','DeliveryDate','');
                save('${id}','InfantStatus','');
                document.getElementById('caldate-${id}').value = '';
              ">✕</button>
          </div>

          <select onchange="save('${id}','InfantStatus', this.value)">
            <option value="">Infant</option>
            <option ${rec.InfantStatus==="Alive"?"selected":""}>Alive</option>
            <option ${rec.InfantStatus==="Deceased"?"selected":""}>Deceased</option>
            <option ${rec.InfantStatus==="Pulled"?"selected":""}>Pulled</option>
          </select>

          <select onchange="save('${id}','Placenta', this.value)">
            <option value="">Placenta</option>
            <option ${rec.Placenta==="Yes"?"selected":""}>Yes</option>
            <option ${rec.Placenta==="No"?"selected":""}>No</option>
          </select>

          <select onchange="save('${id}','Foster', this.value)">
            <option value="">Foster</option>
            <option ${rec.Foster==="Yes"?"selected":""}>Yes</option>
            <option ${rec.Foster==="No"?"selected":""}>No</option>
          </select>

          <textarea onchange="save('${id}','Notes', this.value)">${rec.Notes || ""}</textarea>

        </div>
      `;

      app.appendChild(row);
    });

    if (deliveries.length === 0) {
      app.innerHTML = "<div style='padding:20px;'>No deliveries on this date</div>";
    }
  }
}

// ✅ AUTO REFRESH
setInterval(loadData, 15000);

// ✅ START
window.onload = loadData;

</script>

</body>
</html>
