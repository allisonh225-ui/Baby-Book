<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: black;
  color: white;
  font-family: Arial;
  margin: 0;
}

.header {
  position: sticky;
  top: 0;
  background: black;
  z-index: 1000;
  padding: 10px;
  border-bottom: 2px solid #00ffcc;
}

.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
}

.view-btn {
  padding: 10px 14px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
  background: #00ffcc;
  color: black;
  font-weight: bold;
  margin-right: 6px;
}

.view-btn.active {
  background: white;
}

#groupFilter {
  padding: 10px;
  font-size: 16px;
}

/* ✅ ROW BASE */
.row {
  border-bottom: 1px solid #444;
  padding: 14px;
}

/* ✅ ROW HIGHLIGHTING */
.row.yellow { background: rgba(255,255,0,0.08); }
.row.red    { background: rgba(255,0,0,0.08); }
.row.green  { background: rgba(0,255,0,0.08); }

.row-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.date {
  color: #00ffcc;
  font-weight: bold;
}

.card {
  margin-top: 10px;
  padding: 10px;
  background: #111;
}

/* ✅ BIG ICON */
.status-icon {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-right: 10px;
  font-size: 13px;
  font-weight: bold;
  color: black;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="header">

  <div class="top-row">
    <h2>Baby Book</h2>
    <div id="liveCount">Live: 0</div>
  </div>

  <div class="controls">
    <div>
      <button id="listBtn" class="view-btn active" onclick="switchView('list')">List</button>
      <button id="calBtn" class="view-btn" onclick="switchView('calendar')">Calendar</button>
    </div>

    <select id="groupFilter"></select>
  </div>

  <div id="calendarControls" class="hidden" style="margin-top:10px;">
    <input type="date" id="calendarDate">
    <button class="view-btn" onclick="goToday()">Today</button>
    <div id="dayCount" style="margin-top:5px;"></div>
  </div>

</div>

<div id="app"></div>

<script>

const API_URL = "https://script.google.com/u/0/home/projects/1igCAHeragUJF9o8WBVCzXM43jeBCQaKDV5S_JDuoQOxcBoNtkZB-BxJv/edit";

let roster = [];
let records = {};

let selectedGroup = "";
let currentView = "list";
let selectedDate = new Date().toISOString().split("T")[0];

async function loadData() {
  const res = await fetch(API_URL);
  const data = await res.json();

  roster = data.map(row => ({
    AnimalID: String(row.AnimalID),
    Name: row.Name || "(no name)",
    Group: row.Group,
    Shelter: row.Shelter,
    Sex: "F"
  }));

  records = {};

  data.forEach(row => {
    records[row.AnimalID] = {
      DeliveryDate: formatDate(row["Delivery Date"]),
      InfantStatus: row["Infant Status"],
      Placenta: row["Placenta"],
      Foster: row["Foster Infant"],
      Notes: row["Notes"]
    };
  });

  roster.sort((a,b) => Number(a.AnimalID) - Number(b.AnimalID));

  init();
  render();
}

function formatDate(d) {
  if (!d) return "";
  return new Date(d).toISOString().split("T")[0];
}

function init() {
  const groups = [...new Set(roster.map(r => r.Group + " | " + r.Shelter))];

  let filter = document.getElementById("groupFilter");
  filter.innerHTML = "<option value=''>All Groups</option>";

  groups.forEach(g => {
    filter.innerHTML += `<option value="${g}">${g}</option>`;
  });

  filter.onchange = e => {
    selectedGroup = e.target.value;
    render();
  };

  document.getElementById("calendarDate").value = selectedDate;
}

function save(id, field, value) {

  if (!records[id]) records[id] = {};
  records[id][field] = value;

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      AnimalID: id,
      "Delivery Date": records[id].DeliveryDate,
      "Infant Status": records[id].InfantStatus,
      "Placenta": records[id].Placenta,
      "Foster Infant": records[id].Foster,
      "Notes": records[id].Notes
    })
  });

  render();
}

function switchView(view) {
  currentView = view;

  document.getElementById("calendarControls")
    .classList.toggle("hidden", view !== "calendar");

  document.getElementById("listBtn").classList.toggle("active", view === "list");
  document.getElementById("calBtn").classList.toggle("active", view === "calendar");

  render();
}

function goToday() {
  selectedDate = new Date().toISOString().split("T")[0];
  document.getElementById("calendarDate").value = selectedDate;
  render();
}

function getStatus(rec) {
  if (!rec.DeliveryDate) return { color:"yellow", cls:"yellow", label:"" };
  if (rec.Foster === "Yes") return { color:"limegreen", cls:"green", label:"F" };
  if (rec.InfantStatus === "Alive") return { color:"limegreen", cls:"green", label:"" };
  return { color:"red", cls:"red", label:"" };
}

function render() {

  let app = document.getElementById("app");
  app.innerHTML = "";

  let liveCount = 0;

  if (currentView === "list") {

    roster
      .filter(r => !selectedGroup || (r.Group + " | " + r.Shelter) === selectedGroup)
      .forEach(r => {

        let rec = records[r.AnimalID] || {};
        const status = getStatus(rec);

        if (rec.DeliveryDate && (rec.Foster==="Yes" || rec.InfantStatus==="Alive")) {
          liveCount++;
        }

        let row = document.createElement("div");
        row.className = "row " + status.cls;

        row.innerHTML = `
          <div class="row-header" onclick="toggleCard('${r.AnimalID}')">
            <div style="display:flex; align-items:center;">
              
              <div class="status-icon" style="background:${status.color}">
                ${status.label}
              </div>

              ${r.AnimalID} ${r.Name}
            </div>

            <div class="date">${rec.DeliveryDate || "—"}</div>
          </div>

          <div id="card-${r.AnimalID}" class="card hidden">

            <input type="date"
              value="${rec.DeliveryDate || ''}"
              onchange="
                save('${r.AnimalID}','DeliveryDate', this.value);
                if (!records['${r.AnimalID}']?.InfantStatus) {
                  save('${r.AnimalID}','InfantStatus','Alive');
                }
              ">

            <select onchange="save('${r.AnimalID}','InfantStatus', this.value)">
              <option value="">Infant</option>
              <option ${rec.InfantStatus==="Alive"?"selected":""}>Alive</option>
              <option ${rec.InfantStatus==="Deceased"?"selected":""}>Deceased</option>
              <option ${rec.InfantStatus==="Pulled"?"selected":""}>Pulled</option>
            </select>

            <select onchange="save('${r.AnimalID}','Placenta', this.value)">
              <option value="">Placenta</option>
              <option ${rec.Placenta==="Yes"?"selected":""}>Yes</option>
              <option ${rec.Placenta==="No"?"selected":""}>No</option>
            </select>

            <select onchange="save('${r.AnimalID}','Foster', this.value)">
              <option value="">Foster</option>
              <option ${rec.Foster==="Yes"?"selected":""}>Yes</option>
              <option ${rec.Foster==="No"?"selected":""}>No</option>
            </select>

            <textarea onchange="save('${r.AnimalID}','Notes', this.value)">
${rec.Notes || ""}
            </textarea>

          </div>
        `;

        app.appendChild(row);
      });

    document.getElementById("liveCount").innerText = "Live: " + liveCount;
  }

}

window.onload = loadData;

</script>

</body>
</html>
