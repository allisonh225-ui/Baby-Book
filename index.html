<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwDEpL21Qwj2eWiLSrgNf0kaV2xc3L2ov47CwUH9ZmVih1TgwwB679-BXxs4tQBTxM6OA/exec";

let roster = [];
let records = {};

let selectedGroup = "";
let currentView = "list";
let selectedDate = new Date().toISOString().split("T")[0];

async function loadData() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    alert("Loaded " + data.length + " rows");

    roster = data.map(row => ({
      AnimalID: String(row.AnimalID),
      Name: row.Name || "(no name)",
      Group: row.Group,
      Shelter: row.Shelter,
      Sex: "F"
    }));

    records = {};

    data.forEach(row => {
      records[row.AnimalID] = {
        DeliveryDate: formatDate(row["Delivery Date"]),
        InfantStatus: row["Infant Status"],
        Placenta: row["Placenta"],
        Foster: row["Foster Infant"],
        Notes: row["Notes"]
      };
    });

    roster.sort((a, b) => Number(a.AnimalID) - Number(b.AnimalID));

    init();
    render();

  } catch (err) {
    alert("ERROR: " + err.message);
    console.error(err);
  }
}

function formatDate(d) {
  if (!d) return "";
  return new Date(d).toISOString().split("T")[0];
}

window.onload = loadData;

</script>
